<!doctype html>
<meta charset="utf-8" />
<title>Custom Attributes polyfill example</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 40em; margin: 2em auto; }
  label { display: block; margin-block: 1em; }
  input, textarea { display: block; width: 100%; }
  [data-word-count]::after { content: attr(data-word-count) " words"; display: block; color: gray; font-size: 0.9em; }
  .status { padding: 0.5em 1em; border-left: 4px solid gray; background: #f9f9f9; }
  .status[data-state="native"] { border-color: green; }
  .status[data-state="polyfilled"] { border-color: orange; }
  .status[data-state="none"] { border-color: red; }
</style>

<h1>Custom Attributes</h1>

<p class="status" id="status">Checking support...</p>

<p>
  Reload this page: the fields below keep their values through
  <code>persist-value</code>. Type into the textarea to see
  <code>word-count</code> react to input.
</p>

<label>
  Name
  <input name="name" persist-value />
</label>
<label>
  Bio
  <textarea name="bio" persist-value="draft-bio" word-count></textarea>
</label>

<p>
  <button id="toggle">Toggle <code>word-count</code></button>
  <button id="detach">Detach and re-attach the textarea</button>
</p>

<pre id="log"></pre>

<script type="module">
  import { isSupported, isPolyfilled, apply } from "./custom-attributes.js";

  const status = document.getElementById("status");
  if (isSupported()) {
    status.dataset.state = "native";
    status.textContent = "This browser supports Custom Attributes natively. The polyfill is not needed.";
  } else {
    apply();
    status.dataset.state = isPolyfilled() ? "polyfilled" : "none";
    status.textContent = isPolyfilled()
      ? "This browser does not support Custom Attributes natively; the polyfill has been applied on this page."
      : "The polyfill could not be applied in this browser.";
  }

  const log = (message) => {
    document.getElementById("log").textContent += message + "\n";
  };

  // ownerElement is null inside disconnectedCallback when the attribute
  // itself was removed, so the element is remembered on connect.
  class PersistValue extends Attr {
    #owner = null;

    connectedCallback() {
      this.#owner = this.ownerElement;
      log(`persist-value connected to <${this.#owner.localName}>`);
      const stored = localStorage.getItem(this.key);
      if (stored !== null) this.#owner.value = stored;
      this.#owner.addEventListener("input", this);
    }

    disconnectedCallback() {
      log(`persist-value disconnected`);
      this.#owner.removeEventListener("input", this);
      this.#owner = null;
    }

    attributeChangedCallback(oldValue, newValue) {
      this.key = newValue || this.ownerElement?.name;
    }

    handleEvent() {
      localStorage.setItem(this.key, this.#owner.value);
    }
  }

  // Form controls are replaced elements and cannot render ::after, so the
  // count is written to the enclosing <label>.
  class WordCount extends Attr {
    #owner = null;
    #target = null;

    connectedCallback() {
      this.#owner = this.ownerElement;
      this.#target = this.#owner.closest("label") ?? this.#owner;
      log(`word-count connected`);
      this.#owner.addEventListener("input", this);
      this.handleEvent();
    }

    disconnectedCallback() {
      log(`word-count disconnected`);
      this.#owner.removeEventListener("input", this);
      this.#target.removeAttribute("data-word-count");
      this.#owner = this.#target = null;
    }

    handleEvent() {
      const words = this.#owner.value.trim().split(/\s+/).filter(Boolean);
      this.#target.setAttribute("data-word-count", words.length);
    }
  }

  customAttributes.define("persist-value", PersistValue);
  customAttributes.define("word-count", WordCount);

  const textarea = document.querySelector("textarea");
  document.getElementById("toggle").onclick = () => {
    textarea.toggleAttribute("word-count");
  };
  document.getElementById("detach").onclick = () => {
    const label = textarea.parentNode;
    textarea.remove();
    setTimeout(() => label.append(textarea), 500);
  };
</script>
